development:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://localhost:27017/execution_service_development") %>
test:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://localhost:27017/execution_service_test") %>
      options:
        server_selection_timeout: 5
production:
  clients:
    default:
      uri: <%= ENV["MONGODB_URI"] %>
