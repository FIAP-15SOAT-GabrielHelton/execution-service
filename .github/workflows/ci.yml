name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_extra:
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        id: trivy
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,misconfig
        continue-on-error: true

      - name: Check Trivy results and output warning
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
            MISCONFIG_COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
            TOTAL=$((VULN_COUNT + MISCONFIG_COUNT))

            if [ "$TOTAL" -gt 0 ]; then
              echo "::error::Trivy found $VULN_COUNT HIGH/CRITICAL vulnerabilities and $MISCONFIG_COUNT HIGH/CRITICAL misconfigurations"
              exit 1
            fi
          fi

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/ruby
            p/security-audit
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017

    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
      RAILS_ENV: test
      COVERAGE: "1"
      MONGODB_URI: mongodb://localhost:27017/execution_service_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      # Análise estática + cobertura no SonarQube Cloud. O quality gate reprovado falha o job.
      # Sem o secret (ex.: PR do Dependabot), a etapa é pulada.
      - name: SonarQube scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1 (fixado por SHA, exigência do próprio Sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=fiap-15soat-gabrielhelton
            -Dsonar.projectKey=FIAP-15SOAT-GabrielHelton_execution-service
            -Dsonar.qualitygate.wait=true

      - name: Write coverage to job summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            line=$(jq -r '.result.line' coverage/.last_run.json)
            branch=$(jq -r '.result.branch' coverage/.last_run.json)
            {
              echo "## Coverage"
              echo ""
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              echo "| Line | ${line}% |"
              echo "| Branch | ${branch}% |"
              echo ""
              echo "Threshold: 80% line / 80% branch (enforced by SimpleCov)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
