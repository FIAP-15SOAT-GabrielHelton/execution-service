name: CD Deploy (Execution Service on EKS)

# Disparo manual — as credenciais AWS Academy são passadas como inputs porque
# tokens de sessão expiram em ~4h e não podem ser armazenados como secrets fixos.
on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (AWS Academy)'
        required: true
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key (AWS Academy)'
        required: true
        type: string
      aws_session_token:
        description: 'AWS Session Token (AWS Academy)'
        required: true
        type: string

# Garante que apenas uma execução rode por vez. Acionar o cd_destroy.yml
# cancela este workflow imediatamente via o mesmo concurrency group.
concurrency:
  group: oficina-mecanica-execution-service
  cancel-in-progress: true

jobs:
  deploy:
    name: Provision & Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Mascara as credenciais AWS nos logs deste job (secrets do repositório o GitHub já mascara).
      # Deve ser o primeiro step executável do job.
      - name: Mask Sensitive Credentials
        env:
          AWS_KEY_ID: ${{ inputs.aws_access_key_id }}
          AWS_SECRET: ${{ inputs.aws_secret_access_key }}
          AWS_TOKEN: ${{ inputs.aws_session_token }}
        run: |
          echo "::add-mask::$AWS_KEY_ID"
          echo "::add-mask::$AWS_SECRET"
          echo "::add-mask::$AWS_TOKEN"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: us-east-1

      # O bucket S3 armazena o Terraform state enquanto o ambiente estiver ativo.
      # Criado via CLI (não via Terraform) para evitar o chicken-and-egg: o backend
      # precisa existir antes do terraform init. O Account ID no nome garante
      # unicidade global. Idempotente: reutiliza o bucket se já existir.
      - name: Bootstrap S3 Backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_BUCKET="oficina-mecanica-tfstate-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$TF_BUCKET" 2>/dev/null; then
            echo "Bucket $TF_BUCKET já existe. Reutilizando..."
          else
            echo "Criando bucket $TF_BUCKET..."
            aws s3api create-bucket --bucket "$TF_BUCKET" --region us-east-1
          fi

          echo "TF_BUCKET=$TF_BUCKET" >> "$GITHUB_ENV"

      # terraform_wrapper: false evita que o wrapper adicione texto extra ao stdout,
      # garantindo que terraform output -raw capture valores limpos no GITHUB_OUTPUT.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Provisiona apenas o ECR (VPC/EKS, RabbitMQ e MongoDB ficam no repo k8s-infra-fase4).
      - name: Terraform Provisioning
        id: terraform
        run: |
          cd infra/
          terraform init \
            -backend-config="bucket=$TF_BUCKET" \
            -backend-config="key=oficina-mecanica/execution-service.tfstate" \
            -backend-config="region=us-east-1"

          terraform apply -auto-approve

          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      # EKS_CLUSTER_NAME é lido do SSM Parameter Store, publicado pelo repo k8s-infra-fase4
      # (que precisa ter sido implantado antes deste).
      - name: Read Dependencies from SSM
        id: ssm
        run: |
          echo "EKS_CLUSTER_NAME=$(aws ssm get-parameter --name /oficina-mecanica/eks_cluster_name --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"

      # Faz login no ECR, builda a imagem tagueada com o SHA do commit e faz push.
      - name: Build and Push Docker Image
        id: docker
        run: |
          # Extrai apenas o registry (account.dkr.ecr.region.amazonaws.com) da URL completa do ECR
          REGISTRY=$(echo "${{ steps.terraform.outputs.ECR_URL }}" | cut -d'/' -f1)
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

          IMAGE_URI="${{ steps.terraform.outputs.ECR_URL }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # Deploy no EKS: configuração, workloads (web, consumer da Saga, service e HPA).
      # Sem migrations: o MongoDB não tem schema.
      - name: Deploy to Kubernetes
        env:
          CLUSTER_NAME: ${{ steps.ssm.outputs.EKS_CLUSTER_NAME }}
          IMAGE_URI: ${{ steps.docker.outputs.image_uri }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1

          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/*-deployment.yaml

          # Configuração antes dos workloads. O Secret é gerado aqui, a partir dos secrets do repositório.
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic execution-service-secrets \
            --from-literal=SECRET_KEY_BASE="$SECRET_KEY_BASE" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=RABBITMQ_URL="amqp://oficina:${RABBITMQ_PASSWORD}@rabbitmq:5672" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Sobe os workloads; o restart garante que os pods releiam o Secret/ConfigMap.
          kubectl apply -f k8s/web-deployment.yaml -f k8s/consumer-deployment.yaml -f k8s/service.yaml -f k8s/hpa.yaml
          kubectl rollout restart deployment/execution-service-web deployment/execution-service-consumer
          kubectl rollout status deployment/execution-service-web deployment/execution-service-consumer --timeout=300s

      # Publica o hostname público do ELB no SSM. O provisionamento do LoadBalancer pela AWS é assíncrono após o
      # kubectl apply, por isso o polling.
      - name: Publish Execution Service URL to SSM
        run: |
          for i in $(seq 1 30); do
            HOSTNAME=$(kubectl get svc execution-service-web -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOSTNAME" ]; then
              break
            fi
            echo "Aguardando o Load Balancer receber um hostname... ($i/30)"
            sleep 10
          done

          if [ -z "$HOSTNAME" ]; then
            echo "::error::Load Balancer não recebeu hostname a tempo."
            exit 1
          fi

          aws ssm put-parameter \
            --name /oficina-mecanica/execution_api_base_url \
            --type String \
            --value "http://${HOSTNAME}" \
            --overwrite

  auto-destroy:
    name: Autodestruição de Segurança
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Mascaramento repetido pois cada job tem seu próprio contexto de logs.
      - name: Mask Sensitive Credentials
        env:
          AWS_KEY_ID: ${{ inputs.aws_access_key_id }}
          AWS_SECRET: ${{ inputs.aws_secret_access_key }}
          AWS_TOKEN: ${{ inputs.aws_session_token }}
        run: |
          echo "::add-mask::$AWS_KEY_ID"
          echo "::add-mask::$AWS_SECRET"
          echo "::add-mask::$AWS_TOKEN"

      # Janela de 2h para uso/demonstração do ambiente.
      # ATENÇÃO: tokens AWS Academy expiram em ~4h desde o início da sessão.
      # Tempo total estimado: ~30min deploy + 2h sleep + ~20min destroy = ~2h50min.
      # Iniciar o workflow com menos de 3h de sessão restante pode causar falha no destroy.
      - name: Safety Sleep (Wait 2 Hours)
        run: sleep 7200

      # Delega o destroy para a composite action compartilhada com o cd_destroy.yml.
      - name: Destroy Infrastructure
        uses: ./.github/actions/infra-destroy
        with:
          aws_access_key_id: ${{ inputs.aws_access_key_id }}
          aws_secret_access_key: ${{ inputs.aws_secret_access_key }}
          aws_session_token: ${{ inputs.aws_session_token }}
