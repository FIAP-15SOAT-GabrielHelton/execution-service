apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service-web
  namespace: default
  labels:
    app: execution-service-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service-web
  template:
    metadata:
      labels:
        app: execution-service-web
    spec:
      # O pod não fala com a API do Kubernetes; sem token da service account montado.
      automountServiceAccountToken: false
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Toda a configuração vem do ConfigMap e do Secret deste serviço (o Secret é criado pelo cd_deploy.yml).
          envFrom:
            - configMapRef:
                name: execution-service-config
            - secretRef:
                name: execution-service-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
